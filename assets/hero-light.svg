  <style>
    .eyebrow { font: 600 17px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; letter-spacing: 3px; }
    .name    { font: 700 104px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -4px; fill: #1D1D1F; }
    .tag     { font: 400 31px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.5px; fill: #515154; }
    .term    { font: 500 17px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; fill: #86868B; }
    .term .cmd { fill: #515154; }
    .term .ok  { fill: #00A39A; }
    
    .caption { font: 600 10.5px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; letter-spacing: 2.2px; fill: #86868B; text-anchor: middle; opacity: 0.85; }
    .edge    { fill: none; stroke-width: 1.4; stroke-opacity: 0.6; }
    .pill    { fill: #FFFFFF; fill-opacity: 0.78; stroke: #000000; stroke-opacity: 0.10; }
    .pill.gw { fill: #0071E3; fill-opacity: 0.14; stroke: #0071E3; stroke-opacity: 0.75; stroke-width: 1.3; }
    .plabel  { font: 500 12.5px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; fill: #515154; }
    .plabel.strong { fill: #1D1D1F; }
    @media (prefers-reduced-motion: reduce) { .fx { display: none; } }
    .a1 { animation: drift1 18s ease-in-out infinite alternate; }
    .a2 { animation: drift2 22s ease-in-out infinite alternate; }
    .a3 { animation: drift3 26s ease-in-out infinite alternate; }
    .cursor { fill: #0AA5D8; animation: blink 1.1s steps(1) infinite; }
    @keyframes drift1 { to { transform: translate(-90px, 40px); } }
    @keyframes drift2 { to { transform: translate(-60px, -50px); } }
    @keyframes drift3 { to { transform: translate(80px, -30px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
