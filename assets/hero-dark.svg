<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 440" width="1200" height="440" role="img" aria-labelledby="title desc">
  <title id="title">Saud Khan — Software Engineer · Software Architect</title>
  <desc id="desc">Scalable systems. Clean architecture. Considered details. An animated diagram shows requests flowing from a client through an API gateway to services and data stores.</desc>
  <defs>
    <clipPath id="card"><rect width="1200" height="440" rx="28"/></clipPath>
    <filter id="blur" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="72"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#FFFFFF" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
    <radialGradient id="fade" cx="80%" cy="50%" r="62%">
      <stop offset="0" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
    <mask id="gridmask"><rect width="1200" height="440" fill="url(#fade)"/></mask>
    <linearGradient id="eyebrow" x1="0" x2="1">
      <stop offset="0" stop-color="#0A84FF"/>
      <stop offset="0.6" stop-color="#64D2FF"/>
      <stop offset="1" stop-color="#66D4CF"/>
    </linearGradient>
  </defs>
  <style>
    .eyebrow { font: 600 17px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; letter-spacing: 3px; }
    .name    { font: 700 104px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -4px; fill: #F5F5F7; }
    .tag     { font: 400 31px -apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Inter', 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; letter-spacing: -0.5px; fill: #A1A1A6; }
    .term    { font: 500 17px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; fill: #6E6E73; }
    .term .cmd { fill: #A1A1A6; }
    .term .ok  { fill: #66D4CF; }
    .label   { font: 500 13px 'SF Mono', ui-monospace, Menlo, Monaco, Consolas, 'Liberation Mono', 'DejaVu Sans Mono', monospace; fill: #6E6E73; text-anchor: middle; }
    .edge    { fill: none; stroke: #6E6E73; stroke-opacity: 0.45; stroke-width: 1.2; }
    .flow    { fill: none; stroke: #64D2FF; stroke-width: 2.4; stroke-linecap: round;
               stroke-dasharray: 7 93; stroke-dashoffset: 100; opacity: 0;
               animation: flow 3.6s cubic-bezier(.45,0,.25,1) infinite; }
    .node    { fill: #0A0A0C; stroke: #64D2FF; stroke-width: 1.6; }
    .node.gw { stroke: #0A84FF; stroke-width: 2; animation: pulse 3.6s ease-in-out infinite; }
    .a1 { animation: drift1 18s ease-in-out infinite alternate; }
    .a2 { animation: drift2 22s ease-in-out infinite alternate; }
    .a3 { animation: drift3 26s ease-in-out infinite alternate; }
    .cursor { fill: #64D2FF; animation: blink 1.1s steps(1) infinite; }
    @keyframes flow  { 0% { stroke-dashoffset: 100; opacity: 0; } 8% { opacity: 1; } 55% { stroke-dashoffset: 0; opacity: 1; } 62%, 100% { stroke-dashoffset: 0; opacity: 0; } }
    @keyframes pulse { 0%, 100% { stroke-opacity: 1; } 50% { stroke-opacity: 0.45; } }
    @keyframes drift1 { to { transform: translate(-90px, 40px); } }
    @keyframes drift2 { to { transform: translate(-60px, -50px); } }
    @keyframes drift3 { to { transform: translate(80px, -30px); } }
    @keyframes blink { 50% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>
  <g clip-path="url(#card)">
    <rect width="1200" height="440" fill="#0A0A0C"/>
    <g filter="url(#blur)" opacity="0.42">
      <circle class="a1" cx="900" cy="110" r="165" fill="#0A84FF"/>
      <circle class="a2" cx="1080" cy="340" r="150" fill="#64D2FF"/>
      <circle class="a3" cx="700" cy="380" r="120" fill="#66D4CF"/>
    </g>
    <rect width="1200" height="440" fill="url(#grid)" mask="url(#gridmask)"/>

    <g>
      <path d="M800 220 C852.5 220 852.5 220 905 220" class="edge"/>
      <path d="M905 220 C960.0 220 960.0 132 1015 132" class="edge"/>
      <path d="M905 220 C960.0 220 960.0 220 1015 220" class="edge"/>
      <path d="M905 220 C960.0 220 960.0 308 1015 308" class="edge"/>
      <path d="M1015 132 C1066.5 132 1066.5 132 1118 132" class="edge"/>
      <path d="M1015 220 C1066.5 220 1066.5 220 1118 220" class="edge"/>
      <path d="M1015 308 C1066.5 308 1066.5 308 1118 308" class="edge"/>
      <path d="M800 220 C852.5 220 852.5 220 905 220" pathLength="100" class="flow" style="animation-delay:0.00s"/>
      <path d="M905 220 C960.0 220 960.0 132 1015 132" pathLength="100" class="flow" style="animation-delay:1.05s"/>
      <path d="M905 220 C960.0 220 960.0 220 1015 220" pathLength="100" class="flow" style="animation-delay:1.20s"/>
      <path d="M905 220 C960.0 220 960.0 308 1015 308" pathLength="100" class="flow" style="animation-delay:0.90s"/>
      <path d="M1015 132 C1066.5 132 1066.5 132 1118 132" pathLength="100" class="flow" style="animation-delay:1.95s"/>
      <path d="M1015 220 C1066.5 220 1066.5 220 1118 220" pathLength="100" class="flow" style="animation-delay:2.10s"/>
      <path d="M1015 308 C1066.5 308 1066.5 308 1118 308" pathLength="100" class="flow" style="animation-delay:1.80s"/>
      <circle cx="800" cy="220" r="5" class="node"/>
      <text x="800" y="246" class="label">client</text>
      <circle cx="905" cy="220" r="7" class="node gw"/>
      <text x="905" y="246" class="label">gateway</text>
      <circle cx="1015" cy="132" r="5" class="node"/>
      <text x="1015" y="158" class="label">identity</text>
      <circle cx="1015" cy="220" r="5" class="node"/>
      <text x="1015" y="246" class="label">orders</text>
      <circle cx="1015" cy="308" r="5" class="node"/>
      <text x="1015" y="334" class="label">catalog</text>
      <circle cx="1118" cy="132" r="5" class="node"/>
      <text x="1118" y="158" class="label">sql</text>
      <circle cx="1118" cy="220" r="5" class="node"/>
      <text x="1118" y="246" class="label">events</text>
      <circle cx="1118" cy="308" r="5" class="node"/>
      <text x="1118" y="334" class="label">cache</text>
    </g>

    <text x="80" y="140" class="eyebrow" fill="url(#eyebrow)">SOFTWARE ENGINEER · SOFTWARE ARCHITECT</text>
    <text x="73" y="240" class="name">Saud Khan</text>
    <text x="80" y="296" class="tag">Scalable systems. Clean architecture.</text>
    <text x="80" y="337" class="tag">Considered details.</text>
    <text x="80" y="396" class="term" textLength="408.0" lengthAdjust="spacingAndGlyphs"><tspan class="ok">saud@arch</tspan> ~ ❯ <tspan class="cmd">architect · build · refine</tspan></text>
    <rect x="494.0" y="382" width="10" height="19" rx="1.5" class="cursor"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="439" rx="27.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.09"/>
</svg>
